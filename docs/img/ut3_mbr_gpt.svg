<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" font-family="Arial, sans-serif">
  <title>Comparativa de la estructura de un disco con MBR (hasta 4 particiones primarias, una de ellas extendida con particiones lógicas) y con GPT (cabecera y tabla al inicio, copia de seguridad al final y hasta 128 particiones)</title>
  <rect x="0" y="0" width="820" height="310" rx="10" fill="#f8fafc"/>
  <g font-size="13" text-anchor="middle">
    <text x="20" y="50" fill="#1b2a41" font-size="16" font-weight="bold" text-anchor="start">MBR (Master Boot Record) — esquema clásico</text>
    <rect x="20" y="64" width="90" height="66" fill="#e65100"/>
    <text x="65" y="94" fill="#fff" font-weight="bold">MBR</text>
    <text x="65" y="112" fill="#fff" font-size="11">512 bytes</text>
    <rect x="110" y="64" width="170" height="66" fill="#3949ab"/>
    <text x="195" y="102" fill="#fff">Primaria 1</text>
    <rect x="280" y="64" width="170" height="66" fill="#5c6bc0"/>
    <text x="365" y="102" fill="#fff">Primaria 2</text>
    <rect x="450" y="64" width="170" height="66" fill="#7986cb"/>
    <text x="535" y="102" fill="#fff">Primaria 3</text>
    <rect x="620" y="64" width="180" height="66" fill="#9fa8da"/>
    <text x="710" y="80" fill="#1b2a41" font-size="11" font-weight="bold">Extendida (4.ª)</text>
    <rect x="628" y="88" width="78" height="34" fill="#e8eaf6"/>
    <text x="667" y="110" fill="#1b2a41" font-size="12">Lógica 5</text>
    <rect x="714" y="88" width="78" height="34" fill="#e8eaf6"/>
    <text x="753" y="110" fill="#1b2a41" font-size="12">Lógica 6</text>
    <text x="20" y="152" fill="#6b7280" text-anchor="start">Máximo 4 particiones primarias (o 3 + 1 extendida con lógicas) · discos de hasta 2 TiB · BIOS o UEFI</text>

    <text x="20" y="196" fill="#1b2a41" font-size="16" font-weight="bold" text-anchor="start">GPT (GUID Partition Table) — esquema moderno</text>
    <rect x="20" y="210" width="80" height="66" fill="#b0b7c3"/>
    <text x="60" y="238" fill="#1b2a41" font-size="12">MBR</text>
    <text x="60" y="254" fill="#1b2a41" font-size="12">protector</text>
    <rect x="100" y="210" width="100" height="66" fill="#e65100"/>
    <text x="150" y="238" fill="#fff" font-size="12">Cabecera</text>
    <text x="150" y="254" fill="#fff" font-size="12">+ tabla GPT</text>
    <rect x="200" y="210" width="130" height="66" fill="#2f6f4f"/>
    <text x="265" y="238" fill="#fff" font-size="12">Partición EFI</text>
    <text x="265" y="254" fill="#fff" font-size="12">(ESP)</text>
    <rect x="330" y="210" width="150" height="66" fill="#3949ab"/>
    <text x="405" y="248" fill="#fff">Partición 2</text>
    <rect x="480" y="210" width="150" height="66" fill="#5c6bc0"/>
    <text x="555" y="248" fill="#fff">Partición 3</text>
    <rect x="630" y="210" width="70" height="66" fill="#7986cb"/>
    <text x="665" y="248" fill="#fff" font-size="16">…</text>
    <rect x="700" y="210" width="100" height="66" fill="#e65100"/>
    <text x="750" y="238" fill="#fff" font-size="12">Copia de</text>
    <text x="750" y="254" fill="#fff" font-size="12">seguridad GPT</text>
    <text x="20" y="298" fill="#6b7280" text-anchor="start">Hasta 128 particiones (en Windows) · discos de más de 2 TiB · arranque UEFI · tabla duplicada al final del disco</text>
  </g>
</svg>
