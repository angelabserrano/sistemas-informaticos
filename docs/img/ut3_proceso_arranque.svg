<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 210" font-family="Arial, sans-serif">
  <title>Proceso de arranque de un equipo: encendido, firmware BIOS/UEFI, gestor de arranque, núcleo del sistema operativo y sistema listo</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="210" rx="10" fill="#f8fafc"/>
  <g font-size="11.5" text-anchor="middle">
    <rect x="20" y="40" width="140" height="110" rx="8" fill="#6b7280"/>
    <text x="90" y="72" fill="#fff" font-size="14" font-weight="bold">1. Encendido</text>
    <text x="90" y="98" fill="#fff">Se pulsa el botón</text>
    <text x="90" y="116" fill="#fff">y la fuente alimenta</text>
    <text x="90" y="134" fill="#fff">la placa base</text>

    <rect x="190" y="40" width="140" height="110" rx="8" fill="#1b2a41"/>
    <text x="260" y="72" fill="#fff" font-size="14" font-weight="bold">2. BIOS / UEFI</text>
    <text x="260" y="98" fill="#fff">Comprueba el hardware</text>
    <text x="260" y="116" fill="#fff">(POST) y busca un</text>
    <text x="260" y="134" fill="#fff">dispositivo de arranque</text>

    <rect x="360" y="40" width="140" height="110" rx="8" fill="#e65100"/>
    <text x="430" y="66" fill="#fff" font-size="14" font-weight="bold">3. Gestor de</text>
    <text x="430" y="84" fill="#fff" font-size="14" font-weight="bold">arranque</text>
    <text x="430" y="108" fill="#fff">GRUB2 o</text>
    <text x="430" y="126" fill="#fff">Windows Boot Manager</text>

    <rect x="530" y="40" width="140" height="110" rx="8" fill="#3949ab"/>
    <text x="600" y="72" fill="#fff" font-size="14" font-weight="bold">4. Núcleo (kernel)</text>
    <text x="600" y="98" fill="#fff">Se carga en memoria</text>
    <text x="600" y="116" fill="#fff">y detecta controladores</text>
    <text x="600" y="134" fill="#fff">y dispositivos</text>

    <rect x="700" y="40" width="140" height="110" rx="8" fill="#2f6f4f"/>
    <text x="770" y="72" fill="#fff" font-size="14" font-weight="bold">5. Sistema listo</text>
    <text x="770" y="98" fill="#fff">Arrancan los servicios</text>
    <text x="770" y="116" fill="#fff">y aparece el inicio</text>
    <text x="770" y="134" fill="#fff">de sesión</text>
  </g>
  <g stroke="#6b7280" stroke-width="2.5" marker-end="url(#flecha)">
    <line x1="162" y1="95" x2="187" y2="95"/>
    <line x1="332" y1="95" x2="357" y2="95"/>
    <line x1="502" y1="95" x2="527" y2="95"/>
    <line x1="672" y1="95" x2="697" y2="95"/>
  </g>
  <text x="430" y="185" fill="#6b7280" font-size="13" text-anchor="middle">Si el gestor de arranque falla o se sobrescribe, el equipo se queda en el paso 2: hay que repararlo</text>
</svg>
