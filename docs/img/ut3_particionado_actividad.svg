<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" font-family="Arial, sans-serif">
  <title>Esquema de particiones de la Actividad 3.2 en un disco virtual de 25 GB con tabla GPT: partición del sistema EFI de 512 MB en FAT32 montada en /boot/efi, partición del sistema de 18 GB en ext4 montada en /, partición de intercambio de 4 GB y partición de datos con el resto del disco en ext4 montada en /home</title>
  <rect x="0" y="0" width="820" height="250" rx="10" fill="#f8fafc"/>
  <text x="20" y="36" fill="#1b2a41" font-size="16" font-weight="bold">Disco virtual de 25 GB · tabla de particiones GPT</text>
  <text x="800" y="36" fill="#5a6b80" font-size="12" text-anchor="end">(no está a escala)</text>
  <g font-size="13" text-anchor="middle">
    <rect x="20" y="56" width="40" height="90" fill="#e65100"/>
    <text x="40" y="106" fill="#fff" font-weight="bold" font-size="11">GPT</text>
    <rect x="60" y="56" width="110" height="90" fill="#f9a825"/>
    <text x="115" y="92" fill="#1b2a41" font-weight="bold">ESP</text>
    <text x="115" y="112" fill="#1b2a41" font-size="12">512 MB</text>
    <rect x="170" y="56" width="350" height="90" fill="#3949ab"/>
    <text x="345" y="92" fill="#fff" font-weight="bold">Sistema</text>
    <text x="345" y="112" fill="#fff" font-size="12">18 GB</text>
    <rect x="520" y="56" width="140" height="90" fill="#00897b"/>
    <text x="590" y="92" fill="#fff" font-weight="bold">Swap</text>
    <text x="590" y="112" fill="#fff" font-size="12">4 GB</text>
    <rect x="660" y="56" width="140" height="90" fill="#7cb342"/>
    <text x="730" y="92" fill="#fff" font-weight="bold">Datos</text>
    <text x="730" y="112" fill="#fff" font-size="12">resto (≈ 2,5 GB)</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#1b2a41">
    <text x="115" y="172" font-family="monospace" font-weight="bold">/boot/efi</text>
    <text x="115" y="192">FAT32</text>
    <text x="115" y="212" fill="#5a6b80" font-size="11">arranque UEFI</text>
    <text x="345" y="172" font-family="monospace" font-weight="bold">/</text>
    <text x="345" y="192">ext4</text>
    <text x="345" y="212" fill="#5a6b80" font-size="11">sistema operativo y programas</text>
    <text x="590" y="172" font-family="monospace" font-weight="bold">(sin montaje)</text>
    <text x="590" y="192">linux-swap</text>
    <text x="590" y="212" fill="#5a6b80" font-size="11">memoria de intercambio</text>
    <text x="730" y="172" font-family="monospace" font-weight="bold">/home</text>
    <text x="730" y="192">ext4</text>
    <text x="730" y="212" fill="#5a6b80" font-size="11">documentos de los usuarios</text>
  </g>
  <text x="20" y="238" fill="#5a6b80" font-size="11">GPT reserva un pequeño espacio al principio (cabecera y tabla) y otro al final (copia de seguridad) que el instalador gestiona solo.</text>
</svg>
