<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" font-family="Arial, sans-serif">
  <title>Diagrama de estados de un proceso: Nuevo, Listo, En ejecución, Bloqueado y Terminado, con las transiciones entre ellos</title>
  <rect x="0" y="0" width="760" height="390" rx="10" fill="#f8fafc"/>

  <!-- Estados -->
  <g font-size="14" font-weight="bold" text-anchor="middle">
    <ellipse cx="110" cy="70" rx="70" ry="28" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <text x="110" y="75" fill="#1b2a41">Nuevo</text>

    <ellipse cx="650" cy="70" rx="70" ry="28" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
    <text x="650" y="75" fill="#1b2a41">Terminado</text>

    <ellipse cx="220" cy="190" rx="72" ry="30" fill="#c5cae9" stroke="#3949ab" stroke-width="2"/>
    <text x="220" y="195" fill="#1b2a41">Listo</text>

    <ellipse cx="540" cy="190" rx="72" ry="30" fill="#e65100" stroke="#bf360c" stroke-width="2"/>
    <text x="540" y="195" fill="#fff">En ejecución</text>

    <ellipse cx="380" cy="310" rx="72" ry="30" fill="#3949ab" stroke="#1a237e" stroke-width="2"/>
    <text x="380" y="315" fill="#fff">Bloqueado</text>
  </g>

  <!-- Transiciones -->
  <g fill="none" stroke="#1b2a41" stroke-width="2">
    <!-- Nuevo -> Listo -->
    <path d="M 132 96 L 192 162"/>
    <!-- Listo -> En ejecución -->
    <path d="M 270 166 Q 380 112 488 166"/>
    <!-- En ejecución -> Listo -->
    <path d="M 490 214 Q 380 262 272 214"/>
    <!-- En ejecución -> Bloqueado -->
    <path d="M 528 218 L 438 282"/>
    <!-- Bloqueado -> Listo -->
    <path d="M 322 282 L 234 218"/>
    <!-- En ejecución -> Terminado -->
    <path d="M 566 162 L 626 96"/>
  </g>

  <g fill="#1b2a41">
    <polygon points="192.0,162.0 180.5,157.6 188.7,150.2"/>
    <polygon points="488.0,166.0 475.7,166.0 480.6,156.2"/>
    <polygon points="272.0,214.0 284.3,213.4 279.8,223.5"/>
    <polygon points="438.0,282.0 443.8,271.1 450.2,280.1"/>
    <polygon points="234.0,218.0 246.1,220.0 239.7,228.9"/>
    <polygon points="626.0,96.0 622.7,107.8 614.5,100.4"/>
  </g>

  <!-- Etiquetas de las transiciones -->
  <g font-size="12" fill="#374151">
    <text x="150" y="140" text-anchor="end">Admitido</text>
    <text x="380" y="178" text-anchor="middle">El planificador le asigna la CPU</text>
    <text x="380" y="212" text-anchor="middle">Fin del quantum / expropiación</text>
    <text x="498" y="268" text-anchor="start">Espera E/S o un evento</text>
    <text x="262" y="268" text-anchor="end">E/S o evento completado</text>
    <text x="610" y="140" text-anchor="start">Finaliza</text>
  </g>

  <text x="380" y="372" text-anchor="middle" font-size="12" fill="#6b7280">En un procesador (núcleo) solo puede haber un proceso «En ejecución» a la vez; el resto espera en «Listo» o «Bloqueado».</text>
</svg>
